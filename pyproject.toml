[project]
name = "mitmproxy-mcp"
version = "0.1.0"
description = "MCP server for live viewing and interaction with mitmproxy"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1.1,<3.0",
    "mitmproxy>=11.0.0",
]

[project.scripts]
mitmproxy-mcp = "mitmproxy_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
